name: Churn Model CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      CHURN_PREDICTION_TOKEN: ${{ secrets.CHURN_PREDICTION_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest dvc

      - name: Debug installed mlflow version
        run: pip show mlflow

      - name: Reproduce DVC pipeline
        run: dvc repro

      - name: Run model tests
        run: pytest fastapi_app/load_model_test.py -v

      - name: Push pipeline outputs to DVC remote
        if: success()
        run: dvc push
        continue-on-error: true
